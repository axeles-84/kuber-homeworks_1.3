apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-deployment
  labels:
    app: nginx
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      initContainers:
        - name: init-sleep
          image: busybox:1.36
          command: ["sleep", "30"]
      containers:
        - name: nginx
          image: nginx:1.27
          ports:
            - containerPort: 80